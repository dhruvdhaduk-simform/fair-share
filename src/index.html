<!doctype html>

<html lang="en-IN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fair Share</title>

        <link
            rel="shortcut icon"
            href="assets/icons/fair_share.png"
            type="image/x-icon"
        />

        <meta
            name="description"
            content="Fair Share is a TypeScript-powered expense tracker that automatically splits group costs and tracks who owes what, with data saved in localStorage."
        />

        <!-- Open Graph meta tags -->
        <meta property="og:title" content="Fair Share" />
        <meta
            property="og:description"
            content="Fair Share is a TypeScript-powered expense tracker that automatically splits group costs and tracks who owes what, with data saved in localStorage."
        />
        <meta property="og:image" content="assets/images/cover_image.png" />
        <meta
            property="og:image:alt"
            content="Fair Share : Expense Tracker & Splitter"
        />

        <!-- Twitter Card meta tags -->
        <meta name="twitter:title" content="Fair Share" />
        <meta
            name="twitter:description"
            content="Fair Share is a TypeScript-powered expense tracker that automatically splits group costs and tracks who owes what, with data saved in localStorage."
        />
        <meta name="twitter:url" content="/" />
        <meta
            name="twitter:image:src"
            content="assets/images/cover_image.png"
        />
        <meta
            name="twitter:image:alt"
            content="Fair Share : Expense Tracker & Splitter"
        />

        <link rel="stylesheet" href="styles/index.css" />
        <link rel="stylesheet" href="styles/header.css" />
        <link rel="stylesheet" href="styles/main.css" />
        <link rel="stylesheet" href="styles/form.css" />

        <script src="scripts/index.ts" type="module"></script>
    </head>
    <body class="dark-mode">
        <header class="header">
            <div id="header-title">
                <img
                    src="/src/assets/icons/fair_share.png"
                    alt="fair share logo"
                    id="fair-share-logo"
                />
                <h1 class="">Fair Share</h1>
            </div>
            <div class="btn-controller">
                <button id="theme-toggle-btn">
                    <img
                        src="/src/assets/icons/light-mode.svg"
                        alt="light mode"
                    />
                </button>
                <button id="expense-btn" popovertarget="form-container">
                    Add Expense
                </button>
            </div>
        </header>

        <main class="main-container">
            <p class="main-container-title" role="heading">Recent Expenses</p>

            <!-- recent expensees list -->
            <ul class="recent-expenses"></ul>

            <!-- expense detail popup -->
            <div
                class="expense-detail"
                id="expense-detail"
                popover="auto"
            ></div>
        </main>

        <div id="form-container" class="form-container" popover="auto">
            <p class="form-heading">Add New Expense</p>

            <!-- Add New Expense Form -->
            <form id="add-expense-form">
                <!-- Title input -->
                <div class="form-item">
                    <label for="title">Title</label>
                    <input
                        id="title"
                        name="title"
                        type="text"
                        placeholder="Enter Title"
                        required
                    />
                    <span id="titleError" class="error-message"></span>
                </div>

                <!-- Description input -->
                <div class="form-item">
                    <label for="description">Description</label>
                    <input
                        id="description"
                        name="description"
                        type="text"
                        placeholder="Enter Description"
                        required
                    />
                    <span id="descriptionError" class="error-message"></span>
                </div>

                <!-- Amount input -->
                <div class="form-item">
                    <label for="amount">Amount</label>
                    <input
                        id="amount"
                        name="amount"
                        type="number"
                        placeholder="Enter Amount"
                        required
                    />
                    <span id="amountError" class="error-message"></span>
                </div>

                <!-- Participant input -->
                <div class="form-item">
                    <label for="participant">Participant</label>
                    <div class="participants-input-container">
                        <input
                            id="participant"
                            name="participant"
                            type="text"
                            placeholder="Enter participant"
                        />
                        <button id="add-participant" type="button">Add</button>
                    </div>
                    <span id="participantError" class="error-message"></span>

                    <!-- List of added participants -->
                    <div class="participants"></div>
                </div>

                <!-- Select which participant paid -->
                <div class="form-item">
                    <label for="paid-by">Paid By</label>
                    <select name="paid-by" id="paid-by" required>
                        <option value="" disabled selected>
                            select participant
                        </option>
                    </select>
                </div>

                <!-- Submit -->
                <button class="add-expense-btn">Add Expense</button>
            </form>
        </div>
    </body>
</html>
